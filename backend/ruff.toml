target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[lint]
# Ruff defaults (E4, E7, E9, F) plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["auth", "config", "exceptions", "main", "middleware", "models", "rate_limit", "routers", "services", "tools"]
