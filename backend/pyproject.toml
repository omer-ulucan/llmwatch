[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llmwatch"
version = "0.1.0"
description = "Self-hostable LLMOps platform: provider gateway, agent tracing, analytics and statistically honest evals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Omer Ulucan" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "email-validator>=2.1.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.7",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "ddgs>=9.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
mlflow = ["mlflow>=2.14.1"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
llmwatch = "llmwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F) plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["llmwatch"]
