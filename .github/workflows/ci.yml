name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests with coverage
        run: |
          python -m pytest -q --cov --cov-report=term --cov-report=xml
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  postgres:
    name: Backend on Postgres (migrations + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: llmwatch
          POSTGRES_PASSWORD: llmwatch
          POSTGRES_DB: llmwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://llmwatch:llmwatch@localhost:5432/llmwatch_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package with dev and postgres extras
        run: pip install -e ".[dev,postgres]"
      # The migration round trip runs first, on an empty database.
      - name: Migrations
        run: python -m pytest -q tests/test_db.py -k on_test_database
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (eslint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npx vite build
      - name: Unit tests
        run: npm test

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start with zero configuration
        run: docker compose up -d
      - name: Health check through nginx, then sign up
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
          curl -sf -X POST http://localhost:3000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email": "ci@example.com", "password": "ci-password-123", "workspace_name": "CI"}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
