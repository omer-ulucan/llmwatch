server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Eval suites can be imported as YAML/JSON.
    client_max_body_size 10m;

    # Reverse-proxy API requests to the backend container.
    # WHY: Same-origin requests eliminate CORS entirely — the browser
    # sees everything coming from the same host:port.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        # WHY: Overwrite (don't append) X-Forwarded-For with the address nginx
        # actually sees, so clients can't inject fake hops. If another proxy sits
        # in front of this one, configure it here and in TRUSTED_PROXIES.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (chat streaming, agent runs): deliver each event
        # immediately and allow long-running streams.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing; index.html must always be revalidated so new deploys show up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
